name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run lint checks
        run: bash tests/lint/lint.sh

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run unit tests
        run: helm unittest . -f 'tests/unit/*_test.yaml'

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: arrmada-test

      - name: Install local-path-provisioner
        run: |
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
          kubectl rollout status deployment/local-path-provisioner \
            -n local-path-storage --timeout=60s

      - name: Write kubeconfig for test scripts
        run: kubectl config view --raw > tests/.kubeconfig

      - name: Run integration tests
        env:
          KUBECONFIG: ${{ github.workspace }}/tests/.kubeconfig
        run: bash tests/integration/run.sh
