{{- if .Values.prowlarr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arrmada.componentName" (dict "root" . "component" "prowlarr") }}-init
  labels:
    {{- include "arrmada.componentLabels" (dict "root" . "component" "prowlarr") | nindent 4 }}
data:
  init-config.sh: |
    {{- include "arrmada.initConfigScript" (dict "root" . "port" 9696 "pgEnabled" .Values.global.postgresql.prowlarr.enabled) | nindent 4 }}
{{- end }}
