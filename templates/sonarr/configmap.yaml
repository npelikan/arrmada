{{- if .Values.sonarr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arrmada.componentName" (dict "root" . "component" "sonarr") }}-init
  labels:
    {{- include "arrmada.componentLabels" (dict "root" . "component" "sonarr") | nindent 4 }}
data:
  init-config.sh: |
    {{- include "arrmada.initConfigScript" (dict "root" . "port" 8989 "pgEnabled" .Values.global.postgresql.sonarr.enabled) | nindent 4 }}
{{- end }}
