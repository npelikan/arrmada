{{- range .Values.global.media }}
{{- if not .existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arrmada.fullname" $ }}-media-{{ .name }}
  labels:
    {{- include "arrmada.labels" $ | nindent 4 }}
spec:
  # ReadWriteMany is required: Sonarr, Radarr, and rtorrent all mount this volume
  # simultaneously. Pre-existing PVCs (existingClaim) must also be ReadWriteMany.
  accessModes:
    - ReadWriteMany
  {{- if .storageClassName }}
  storageClassName: {{ .storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size | quote }}
{{- end }}
{{- end }}
