# Example Prowlarr Indexers Secret
#
# This Secret contains Prowlarr indexer definitions exported via
# scripts/prowlarr-export.sh. The indexers.json value is a base64-encoded
# JSON array of Prowlarr indexer objects.
#
# Generate this file from a running Prowlarr instance:
#   ./scripts/prowlarr-export.sh http://localhost:9696 <api-key> > prowlarr-indexers.yaml
#
# Reference in values.yaml:
#   prowlarr:
#     config:
#       indexers:
#         existingSecret: prowlarr-indexers
#         secretKey: indexers.json
#
# SECURITY: This file contains sensitive indexer credentials.
# Do NOT commit it to version control. Store it in a password manager
# or use a secrets manager (Vault, Sealed Secrets, External Secrets).

apiVersion: v1
kind: Secret
metadata:
  name: prowlarr-indexers
  namespace: media
type: Opaque
data:
  # Base64-encoded JSON array of Prowlarr indexer objects.
  # The JSON structure below (decoded) shows a typical indexer entry.
  #
  # Decoded example:
  # [
  #   {
  #     "name": "1337x",
  #     "enable": true,
  #     "redirect": false,
  #     "supportsRss": true,
  #     "supportsSearch": true,
  #     "protocol": "torrent",
  #     "privacy": "public",
  #     "implementationName": "1337x",
  #     "implementation": "Cardigann",
  #     "configContract": "CardigannSettings",
  #     "tags": [],
  #     "fields": [
  #       { "name": "baseUrl", "value": "https://1337x.to" }
  #     ]
  #   }
  # ]
  indexers.json: W10K  # Replace with actual base64-encoded indexers JSON
