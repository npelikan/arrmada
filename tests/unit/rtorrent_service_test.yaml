suite: rtorrent service
templates:
  - rtorrent/service.yaml
values:
  - ../values-test.yaml
tests:
  - it: should create service when enabled
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-arrmada-rtorrent

  - it: should not create service when disabled
    set:
      rtorrent.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should default to ClusterIP type
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should expose flood port 3000 and rpc port 5000
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.ports[0].name
          value: flood
      - equal:
          path: spec.ports[1].port
          value: 5000
      - equal:
          path: spec.ports[1].name
          value: rpc

  - it: should select pods with component label
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: rtorrent

  - it: should set component label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: rtorrent

  - it: should respect custom service type
    set:
      rtorrent.service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should respect custom flood and rpc ports
    set:
      rtorrent.service.floodPort: 3001
      rtorrent.service.rpcPort: 5001
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 3001
      - equal:
          path: spec.ports[1].port
          value: 5001
