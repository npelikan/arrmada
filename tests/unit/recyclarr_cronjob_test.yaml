suite: recyclarr cronjob
templates:
  - recyclarr/cronjob.yaml
values:
  - ../values-test.yaml

tests:
  - it: should not create CronJob when recyclarr is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should create CronJob when recyclarr is enabled
    set:
      recyclarr.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-arrmada-recyclarr

  - it: should have recyclarr component label
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: recyclarr

  - it: should use configured schedule
    set:
      recyclarr.enabled: true
      recyclarr.schedule: "0 */12 * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "0 */12 * * *"

  - it: should default to every 6 hours schedule
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.schedule
          value: "0 */6 * * *"

  - it: should use concurrencyPolicy Forbid
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: should retain 3 successful jobs
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3

  - it: should retain 3 failed jobs
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 3

  - it: should use configured container image
    set:
      recyclarr.enabled: true
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ghcr\.io/recyclarr/recyclarr

  - it: should pass sync as the container argument
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          value: sync

  - it: should set restartPolicy to OnFailure
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: OnFailure

  - it: should inject SONARR_API_KEY from secret
    set:
      recyclarr.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: SONARR_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-arrmada-secrets
                key: sonarr-api-key

  - it: should inject RADARR_API_KEY from secret
    set:
      recyclarr.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RADARR_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-arrmada-secrets
                key: radarr-api-key

  - it: should mount recyclarr.yml from configmap
    set:
      recyclarr.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true

  - it: should reference configmap in config volume
    set:
      recyclarr.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-arrmada-recyclarr-config

  - it: should not include cache volume when persistence is disabled
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: false
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: cache
          any: true
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: cache
          any: true

  - it: should include cache volume mount when persistence is enabled
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: cache
            mountPath: /config

  - it: should reference PVC in cache volume when persistence is enabled
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: cache
            persistentVolumeClaim:
              claimName: RELEASE-NAME-arrmada-recyclarr-cache

  - it: should have recyclarr component label on pod template
    set:
      recyclarr.enabled: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: recyclarr
