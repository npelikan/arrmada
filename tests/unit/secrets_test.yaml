suite: secrets
templates:
  - secrets.yaml
values:
  - ../values-test.yaml
tests:
  - it: should create Secret when existingSecret is not set
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-arrmada-secrets

  - it: should not create Secret when existingSecret is set
    set:
      global.existingSecret: my-existing-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should contain sonarr API key
    asserts:
      - isNotEmpty:
          path: stringData["sonarr-api-key"]

  - it: should contain radarr API key
    asserts:
      - isNotEmpty:
          path: stringData["radarr-api-key"]

  - it: should contain prowlarr API key
    asserts:
      - isNotEmpty:
          path: stringData["prowlarr-api-key"]

  - it: should contain postgresql password
    asserts:
      - isNotEmpty:
          path: stringData["postgresql-password"]

  - it: should be of type Opaque
    asserts:
      - equal:
          path: type
          value: Opaque
