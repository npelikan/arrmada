suite: sonarr ingress
templates:
  - sonarr/ingress.yaml
values:
  - ../values-test.yaml
tests:
  - it: should produce no documents when ingress list is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create one Ingress per enabled entry
    set:
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress

  - it: should use entry name as Ingress name suffix
    set:
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-arrmada-sonarr-nginx

  - it: should skip disabled entries
    set:
      sonarr.ingress:
        - name: nginx
          enabled: false
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
    asserts:
      - hasDocuments:
          count: 0

  - it: should set ingressClassName when className is specified
    set:
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should create two Ingress resources for two enabled entries
    set:
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
        - name: tailscale
          enabled: true
          className: tailscale
          hosts:
            - host: sonarr
              paths:
                - path: /
    asserts:
      - hasDocuments:
          count: 2

  - it: should set TLS configuration when provided
    set:
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
          tls:
            - secretName: sonarr-tls
              hosts:
                - sonarr.example.com
    asserts:
      - isNotEmpty:
          path: spec.tls

  - it: should pass annotations through
    set:
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod

  - it: should produce no Ingress when sonarr is disabled
    set:
      sonarr.enabled: false
      sonarr.ingress:
        - name: nginx
          enabled: true
          className: nginx
          hosts:
            - host: sonarr.example.com
              paths:
                - path: /
    asserts:
      - hasDocuments:
          count: 0
