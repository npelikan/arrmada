suite: recyclarr pvc
templates:
  - recyclarr/pvc.yaml
values:
  - ../values-test.yaml

tests:
  - it: should not create PVC when recyclarr is disabled
    set:
      recyclarr.enabled: false
      recyclarr.persistence.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create PVC when persistence is disabled
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create PVC when both recyclarr and persistence are disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should create PVC when recyclarr and persistence are both enabled
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-arrmada-recyclarr-cache

  - it: should have recyclarr component label
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: recyclarr

  - it: should use configured access mode
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
      recyclarr.persistence.accessMode: ReadWriteOnce
    asserts:
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce

  - it: should use configured storage size
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
      recyclarr.persistence.size: 5Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: should not include storageClassName when not configured
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
      recyclarr.persistence.storageClassName: ""
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: should include storageClassName when configured
    set:
      recyclarr.enabled: true
      recyclarr.persistence.enabled: true
      recyclarr.persistence.storageClassName: local-path
    asserts:
      - equal:
          path: spec.storageClassName
          value: local-path
