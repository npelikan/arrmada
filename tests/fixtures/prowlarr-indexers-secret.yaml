## Example Prowlarr indexer Secret fixture for integration tests.
## Contains a minimal indexer definition with no real credentials.
## Apply with: kubectl apply -n arrmada-test -f prowlarr-indexers-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: prowlarr-indexers
  namespace: arrmada-test
type: Opaque
stringData:
  indexers.json: |
    [
      {
        "name": "TestIndexer",
        "enable": true,
        "protocol": "torrent",
        "implementation": "Nyaa",
        "implementationName": "Nyaa",
        "configContract": "NyaaSettings",
        "fields": [
          { "name": "baseUrl", "value": "https://nyaa.si" },
          { "name": "animeStandardFormatSearch", "value": false }
        ],
        "tags": []
      }
    ]
