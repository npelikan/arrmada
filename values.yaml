## ─── Radarr ───────────────────────────────────────────────────────────────────
radarr:
  enabled: true

  image:
    repository: ghcr.io/hotio/radarr
    tag: release
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 7878

  resources: {}

  persistence:
    config:
      enabled: true
      storageClassName: ""
      size: 1Gi
      accessMode: ReadWriteOnce

    media: []

  ingress: []

  config:
    urlBase: ""
    tags: []
    rootFolders: []
    # - path: /movies
    qualityDefinitions: []
    customFormats: []
    qualityProfiles: []
    delayProfiles: []
    downloadClients: []
    notifications: []
    importLists: []
    naming: {}
    # renameMovies: true
    # replaceIllegalCharacters: true
    # colonReplacementFormat: "delete"
    # standardMovieFormat: "{Movie CleanTitle} {(Release Year)} {imdb-{ImdbId}} {edition-{Edition Tags}} {[Custom Formats]}{[Quality Full]}{-Release Group}"
    # movieFolderFormat: "{Movie CleanTitle} {(Release Year)}"
    mediaManagement: {}
    host: {}
    ui: {}

## ─── Prowlarr ─────────────────────────────────────────────────────────────────
prowlarr:
  enabled: true

  image:
    repository: ghcr.io/hotio/prowlarr
    tag: release
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9696

  resources: {}

  persistence:
    config:
      enabled: true
      storageClassName: ""
      size: 1Gi
      accessMode: ReadWriteOnce

  ingress: []

  config:
    urlBase: ""
    tags: []
    ## Download clients managed by Prowlarr
    downloadClients: []
    ## Notifications
    notifications: []
    ## Applications — Prowlarr→Sonarr/Radarr connections.
    ## autoSonarr/autoRadarr auto-generate application entries using release-local URLs.
    ## The auto-generated entries use ${SONARR_API_KEY}/${RADARR_API_KEY} env vars
    ## so API keys are not stored in plaintext in the ConfigMap.
    applications:
      autoSonarr: true
      autoRadarr: true
      ## Additional application entries (any Prowlarr-supported app).
      extra: []
      # - name: "Sonarr-4K"
      #   syncLevel: fullSync
      #   implementation: Sonarr
      #   configContract: SonarrSettings
      #   fields:
      #     - name: baseUrl
      #       value: "http://sonarr-4k:8989"
      #     - name: apiKey
      #       value: "${SONARR4K_API_KEY}"
      #     - name: syncCategories
      #       value: [5000, 5010, 5020, 5030, 5040, 5045, 5050]

    ## Indexers — loaded from an existing Kubernetes Secret.
    ## Use scripts/prowlarr-export.sh to generate the Secret from a local Prowlarr instance.
    indexers:
      ## Name of the Secret containing indexer definitions.
      ## The Secret must have a key matching secretKey (default: indexers.json).
      existingSecret: ""
      secretKey: "indexers.json"

    ## General / host settings (singleton PUT). Leave empty to skip.
    host: {}
    ## UI settings (singleton PUT). Leave empty to skip.
    ui: {}

## ─── Config Sync ──────────────────────────────────────────────────────────────
## Helm hook Job that syncs declarative config to all services after install/upgrade
configSync:
  enabled: true
  image:
    repository: alpine
    tag: "3.19"
  deleteUnmanaged: false
  timeout: 300
  ## Optional: cron schedule for periodic drift reconciliation (e.g. "0 */6 * * *")
  ## Leave empty to disable the CronJob.
  schedule: ""
  ## Additional environment sources (Secrets/ConfigMaps) to inject into the sync Job.
  ## Use this to provide secrets referenced via ${ENV_VAR} in download client / notification configs.
  ## Example:
  ## extraEnvFrom:
  ##   - secretRef:
  ##       name: arrmada-download-client-secrets
  extraEnvFrom: []

## ─── Recyclarr ────────────────────────────────────────────────────────────────
## TRaSH guide sync via Recyclarr CronJob.
## See https://recyclarr.dev for full configuration documentation.
recyclarr:
  enabled: false

  image:
    repository: ghcr.io/recyclarr/recyclarr
    tag: latest
    pullPolicy: IfNotPresent

  ## Cron schedule for TRaSH guide sync. Defaults to every 6 hours.
  schedule: "0 */6 * * *"

  ## Optional PVC for Recyclarr's cache (speeds up repeated runs).
  persistence:
    enabled: false
    storageClassName: ""
    size: 1Gi
    accessMode: ReadWriteOnce

  ## Recyclarr configuration.
  ## Service URLs are auto-populated from the release name.
  ## API keys are injected via !env_var from the chart's Secret.
  config:
    ## Sonarr instances to sync.
    ## Field names use snake_case to mirror the recyclarr.yml format.
    sonarr: []
    # - instance_name: main         # Used as the YAML key in recyclarr.yml
    #   quality_definition:
    #     type: series              # anime or series
    #   quality_profiles:
    #     - name: HD-1080p
    #   custom_formats:
    #     - trash_ids:
    #         - 3a3ff47579026a9e4b651ef28c46b981   # DoVi
    #       assign_scores_to:
    #         - name: HD-1080p
    #           score: 0
    #   delete_old_custom_formats: false

    ## Radarr instances to sync.
    radarr: []
    # - instance_name: main
    #   quality_definition:
    #     type: movie
    #   quality_profiles:
    #     - name: HD-1080p
    #   custom_formats: []
    #   delete_old_custom_formats: false
